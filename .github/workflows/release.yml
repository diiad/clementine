name: Release

on:
  push:
    tags: ["v*"]
  # Manual runs build everything and keep it as workflow artifacts.
  workflow_dispatch:

jobs:
  bundle:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build app
        working-directory: app/src-tauri
        run: cargo tauri build --bundles app
      - name: Build DMG
        run: scripts/make-dmg.sh
      - name: Build CLI
        run: cargo build --release -p clementine-cli
      - name: Collect artifacts
        run: |
          mkdir dist
          cp target/release/bundle/dmg/*.dmg dist/
          tar -czf dist/clementine-cli-macos-arm64.tar.gz -C target/release clementine
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: macos
          path: dist/*
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
          generate_release_notes: true

  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Download PDFium (Windows)
        shell: pwsh
        run: |
          curl.exe -sSL -o pdfium.tgz "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F7881/pdfium-win-x64.tgz"
          New-Item -ItemType Directory -Force pdfium-dist, app/src-tauri/pdfium | Out-Null
          tar -xzf pdfium.tgz -C pdfium-dist
          Copy-Item pdfium-dist/bin/pdfium.dll app/src-tauri/pdfium/
          "CLEMENTINE_PDFIUM=$PWD\app\src-tauri\pdfium\pdfium.dll" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Build installer
        working-directory: app/src-tauri
        run: cargo tauri build
      - name: Build CLI
        run: cargo build --release -p clementine-cli
      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/bundle/nsis/*.exe dist/
          Compress-Archive -Path target/release/clementine.exe, app/src-tauri/pdfium/pdfium.dll -DestinationPath dist/clementine-cli-windows-x64.zip
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: windows
          path: dist/*
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
