[package]
name = "clementine-app"
description = "Clémentine: drag a file, hold a key, drop it on the wheel"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "clementine-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
clementine-core.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
drag = "2"

[target.'cfg(windows)'.dependencies]
tauri-plugin-single-instance = "2"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
# COM drop target for the wheel (same versions as wry). Renamed so it does
# not clash with the app's own `windows` module.
win = { package = "windows", version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_SystemServices",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62"
winreg = "0.55"
# Notifications with an Open button (the plugin's have no actions on desktop).
tauri-winrt-notification = "0.8"

[target.'cfg(not(target_os = "macos"))'.dependencies]
sys-locale = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
libc = "0.2"
mac-notification-sys = "0.6"
objc2-foundation = { workspace = true, features = ["NSString", "NSURL", "NSArray", "NSGeometry", "NSLocale"] }
objc2-app-kit = { workspace = true, features = ["NSEvent", "NSPasteboard", "NSPasteboardItem", "NSScreen", "NSSharingService", "NSWindow", "NSResponder", "NSApplication", "NSRunningApplication", "NSGraphics", "NSHapticFeedback"] }
