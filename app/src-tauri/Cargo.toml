[package]
name = "clementine-app"
description = "Clémentine: drag a file, hold a key, drop it on the wheel"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "clementine-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
clementine-core.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
drag = "2"

[target.'cfg(windows)'.dependencies]
tauri-plugin-single-instance = "2"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.55"

[target.'cfg(not(target_os = "macos"))'.dependencies]
sys-locale = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
libc = "0.2"
objc2-foundation = { workspace = true, features = ["NSString", "NSURL", "NSArray", "NSGeometry", "NSLocale"] }
objc2-app-kit = { workspace = true, features = ["NSEvent", "NSPasteboard", "NSPasteboardItem", "NSScreen", "NSSharingService", "NSWindow", "NSResponder", "NSApplication", "NSRunningApplication", "NSGraphics", "NSHapticFeedback"] }
