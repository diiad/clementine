<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Float</title>
  <style>
    :root { color-scheme: light dark; --bg: #f5f5f7; --row: #fff; --text: #1d1d1f; --muted: #6e6e73; --line: rgba(0,0,0,.08); --accent: #e8730c; }
    @media (prefers-color-scheme: dark) { :root { --bg: #1c1c1e; --row: #2c2c2e; --text: #f5f5f7; --muted: #98989d; --line: rgba(255,255,255,.08); --accent: #ff9f40; } }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 30px 10px 10px; background: var(--bg); color: var(--text); font: 12px/1.3 -apple-system, system-ui, sans-serif; user-select: none; -webkit-user-select: none; }
    header { position: fixed; top: 0; left: 0; right: 0; height: 28px; display: flex; align-items: center; justify-content: flex-end; padding: 0 10px; gap: 8px; }
    header button { font: inherit; border: 0; background: none; color: var(--accent); cursor: pointer; }
    ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
    li { display: flex; align-items: center; gap: 8px; padding: 8px; background: var(--row); border: 1px solid var(--line); border-radius: 8px; cursor: grab; }
    .badge { flex: none; width: 34px; height: 34px; border-radius: 7px; display: grid; place-items: center; font-size: 9px; font-weight: 700; color: #fff; background: var(--accent); text-transform: uppercase; }
    .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    li button { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 14px; }
    .empty { color: var(--muted); text-align: center; margin-top: 40px; }
  </style>
</head>
<body>
  <header data-tauri-drag-region>
    <button id="drag-all" title="Drag every file">Drag all</button>
    <button id="clear">Clear</button>
  </header>
  <ul id="list"></ul>
  <p class="empty" id="empty" hidden>Float files here with ⌃ while dragging.<br>Drag them out when you need them.</p>
  <script src="float.js"></script>
</body>
</html>
