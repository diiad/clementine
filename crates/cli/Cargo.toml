[package]
name = "satsuma-cli"
description = "Command-line front end for the Satsuma conversion engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "satsuma"
path = "src/main.rs"

[dependencies]
satsuma-core.workspace = true
anyhow.workspace = true
clap = { version = "4", features = ["derive"] }
serde_json.workspace = true
