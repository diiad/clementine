[package]
name = "clementine-cli"
description = "Command-line front end for the Clémentine conversion engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "clementine"
path = "src/main.rs"

[dependencies]
clementine-core.workspace = true
anyhow.workspace = true
clap = { version = "4", features = ["derive"] }
serde_json.workspace = true

[dev-dependencies]
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["png"] }
