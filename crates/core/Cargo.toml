[package]
name = "satsuma-core"
description = "Local file conversion engine behind Satsuma"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "ico", "tiff", "webp", "tga", "avif"] }
webp = "0.3"
resvg = "0.45"
calamine = "0.30"
rust_xlsxwriter = "0.90"
csv = "1"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
htmd = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
tempfile = "3"
which = "8"

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-foundation = { workspace = true, features = ["NSString", "NSURL", "NSData", "NSArray", "NSDictionary", "NSAttributedString", "NSValue", "NSGeometry", "NSError", "NSRange"] }
objc2-app-kit = { workspace = true, features = ["NSImage", "NSAttributedString", "NSPasteboard"] }
objc2-pdf-kit = { version = "0.3", features = ["PDFDocument", "PDFPage", "objc2-app-kit"] }
objc2-core-graphics = { version = "0.3", features = ["CGPDFDocument", "CGPDFPage", "CGContext", "CGBitmapContext", "CGImage", "CGColorSpace", "CGGeometry"] }
objc2-core-foundation = { version = "0.3", features = ["CFURL", "CFString", "CFCGTypes"] }
